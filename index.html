<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FAOSTAT Population Data</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <header>
      <h1>FAOSTAT Population Data</h1>
      <div class="panel meta">
        <div class="panel year">
          <div class="year" id="yearLabel">—</div>
          <div class="hint" id="unitLabel"></div>
        </div>

        <div class="controls">
          <button id="playBtn">Play</button>
          <button id="resetBtn">Reset</button>

          <label for="speed">Speed</label>
          <input
            id="speed"
            type="range"
            min="200"
            max="2000"
            step="100"
            value="1000"
          />
          <span id="speedLabel" class="sub"></span>

          <label for="year">Year</label>
          <input
            id="year"
            type="range"
            min="1950"
            max="2050"
            step="1"
            value="1950"
          />
        </div>
      </div>
    </header>

    <div class="wrap">
      <svg
        id="viz"
        role="img"
        aria-label="Animated bubble chart of population by country"
      ></svg>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script type="module" src="main.js"></script>
  </body>
</html>
